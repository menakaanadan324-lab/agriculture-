```yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: agriculture-portal

spec:
  replicas: 2

  selector:
    matchLabels:
      app: agriculture-portal

  template:
    metadata:
      labels:
        app: agriculture-portal

    spec:
      containers:
        - name: agriculture-container
          image: YOUR_DOCKERHUB_USERNAME/agriculture-portal:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service

metadata:
  name: agriculture-service

spec:
  type: NodePort

  selector:
    app: agriculture-portal

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
```
